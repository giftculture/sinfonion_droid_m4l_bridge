# LABELS: master=18
# Sinfonion -> DROID -> Live harmonic bridge, Contract 1 (instance 1)
# Sinfonion OUT 1 = Sync Master, patched to MASTER18 I1
# CC map (USB, channel 1): 19 version, 20 root, 21 scale, 22 transpose,
# 23 harmonic shift, 24 chaotic detune, 25 link state

# ---- Instance 1: Sinfonion ----
[sinfonionlink]
    root = _ROOT             # 0..11
    degree = _SCALE          # 0..107, scale number
    transpose = _TRANS       # 1V/oct
    harmonicshift = _HSHIFT  # -7..7
    chaoticdetune = _DETUNE  # bipolar, +-5 V on the Sinfonion
    linkstate = _LINK        # 0 or 1

# Resend all CCs once a second so a master that starts late gets full state
[lfo]
    hz = 1
    square = _REFRESH

[midiout]
    usb = 1                  # MASTER18 USB-C port
    updateccs = _REFRESH     # DROID only sends CCs on change otherwise
    channel = 1
    ccnumber1 = 19
    cc1 = 0.00787402         # protocol version 1 (1/127)
    ccnumber2 = 20
    cc2 = _ROOT * 0.00787402 + 0.00386    # n/127 + 0.49/127
    ccnumber3 = 21
    cc3 = _SCALE * 0.00787402 + 0.00386
    ccnumber4 = 22
    cc4 = _TRANS * 0.944882 + 0.5078      # (semitones + 64.49) / 127; 1V = 0.1 = 12 semitones
    ccnumber5 = 23
    cc5 = _HSHIFT * 0.00787402 + 0.5078   # (shift + 64.49) / 127
    ccnumber6 = 24
    cc6 = _DETUNE * 0.992 + 0.5078        # (detune + 64.49)/127; assumes +-5 V arrives as +-0.5; VERIFY
    ccnumber7 = 25
    cc7 = _LINK              # 0/1 -> CC 0/127
    # ccnumber8 free (reserved CC 26)
